name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This creates folder variations across every hierarchy layer so all path formats find their images
      - name: Restructure website files
        run: |
          mkdir -p staging/PTBRepo/PTBWebsite
          
          # 1. Map your original workspace directory structure
          cp -r images staging/
          cp -r PTBRepo/PTBWebsite/css staging/PTBRepo/PTBWebsite/
          cp -r PTBRepo/PTBWebsite/html staging/PTBRepo/PTBWebsite/
          
          # 2. Universal Image Mapping: Make copies directly inside every nested level to intercept broken links
          mkdir -p staging/PTBRepo/PTBWebsite/html/images
          mkdir -p staging/PTBRepo/PTBWebsite/html/CA/images
          mkdir -p staging/PTBRepo/PTBWebsite/html/EN/images
          
          cp -r images/* staging/PTBRepo/PTBWebsite/html/images/
          cp -r images/* staging/PTBRepo/PTBWebsite/html/CA/images/
          cp -r images/* staging/PTBRepo/PTBWebsite/html/EN/images/
          
          # 3. Add an automatic bounce rule at the root to drop visitors onto your primary index file
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./PTBRepo/PTBWebsite/html/index.html" /><script>window.location.href="./PTBRepo/PTBWebsite/html/index.html";</script></head></html>' > staging/index.html

      # Fix for Jekyll parser treating folder paths strictly
      - name: Add nojekyll rule
        run: touch staging/.nojekyll

      # Set up deployment configurations
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './staging'

      # Standard clean deployment action with no duplicate ID flags
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
