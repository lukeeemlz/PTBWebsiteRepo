name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages_deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This creates the exact folder tree shown in your VS Code sidebar
      - name: Restructure website files
        run: |
          mkdir -p staging/PTBRepo/PTBWebsite
          cp -r images staging/
          cp -r PTBRepo/PTBWebsite/css staging/PTBRepo/PTBWebsite/
          cp -r PTBRepo/PTBWebsite/html staging/PTBRepo/PTBWebsite/
          
          # This root file forces your main short URL to jump directly into the html folder
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./PTBRepo/PTBWebsite/html/index.html" /><script>window.location.href="./PTBRepo/PTBWebsite/html/index.html";</script></head></html>' > staging/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './staging'

      - name: Deploy to GitHub Pages
        id: pages_deployment
        uses: actions/deploy-pages@v4
