name: Deploy static content to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p staging

          # Homepage
          cp PTBRepo/PTBWebsite/html/index.html staging/

          # Language folders
          mkdir -p staging/EN
          mkdir -p staging/CA

          cp PTBRepo/PTBWebsite/html/EN/* staging/EN/
          cp PTBRepo/PTBWebsite/html/CA/* staging/CA/

          # CSS
          cp -r PTBRepo/PTBWebsite/css staging/

          # JavaScript
          cp -r PTBRepo/PTBWebsite/java staging/

          # Images
          cp -r images staging/

          # Prevent Jekyll processing
          touch staging/.nojekyll

          echo "Published website structure:"
          find staging

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
