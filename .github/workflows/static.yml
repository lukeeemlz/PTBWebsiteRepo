name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p staging

          # Copy the complete website exactly as it exists
          cp -r PTBRepo staging/
          cp -r images staging/

          # Root redirect
          cat > staging/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=PTBRepo/PTBWebsite/html/index.html">
              <script>
                  window.location.replace("PTBRepo/PTBWebsite/html/index.html");
              </script>
          </head>
          <body>
              Redirecting...
          </body>
          </html>
          EOF

          # Disable Jekyll
          touch staging/.nojekyll

          echo "Website contents:"
          find staging

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
