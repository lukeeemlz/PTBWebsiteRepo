name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Copies your JS files from their real home and sets up filename mapping duplicates
      - name: Restructure website files
        run: |
          mkdir -p staging/PTBRepo/PTBWebsite
          
          # 1. Map your original workspace directory structure
          cp -r images staging/
          cp -r PTBRepo/PTBWebsite/css staging/PTBRepo/PTBWebsite/
          cp -r PTBRepo/PTBWebsite/html staging/PTBRepo/PTBWebsite/
          
          # 2. Extract and copy JS files from the true parent directory into the HTML folders where the browser expects them
          cp PTBRepo/PTBWebsite/*.js staging/PTBRepo/PTBWebsite/html/ 2>/dev/null || true
          cp PTBRepo/PTBWebsite/*.js staging/PTBRepo/PTBWebsite/html/CA/ 2>/dev/null || true
          cp PTBRepo/PTBWebsite/*.js staging/PTBRepo/PTBWebsite/html/EN/ 2>/dev/null || true
          
          # 3. Create absolute fallback paths for the images folder container
          mkdir -p staging/PTBRepo/PTBWebsite/images
          mkdir -p staging/PTBRepo/PTBWebsite/html/images
          mkdir -p staging/PTBRepo/PTBWebsite/html/CA/images
          mkdir -p staging/PTBRepo/PTBWebsite/html/EN/images
          
          cp -r images/* staging/PTBRepo/PTBWebsite/images/
          cp -r images/* staging/PTBRepo/PTBWebsite/html/images/
          cp -r images/* staging/PTBRepo/PTBWebsite/html/CA/images/
          cp -r images/* staging/PTBRepo/PTBWebsite/html/EN/images/

          # 4. Extract image files into loose directories to solve missing folder references (e.g. src="conectores.png")
          cp -r images/* staging/PTBRepo/PTBWebsite/html/ 2>/dev/null || true
          cp -r images/* staging/PTBRepo/PTBWebsite/html/CA/ 2>/dev/null || true
          cp -r images/* staging/PTBRepo/PTBWebsite/html/EN/ 2>/dev/null || true
          
          # 5. Handle "filenamepng.png" spelling variations by duplicating files with the double extensions
          cd staging/PTBRepo/PTBWebsite/html/
          for f in *.png; do [ -f "$f" ] && cp "$f" "${f%.png}png.png" 2>/dev/null || true; done
          cd CA/
          for f in *.png; do [ -f "$f" ] && cp "$f" "${f%.png}png.png" 2>/dev/null || true; done
          cd ../EN/
          for f in *.png; do [ -f "$f" ] && cp "$f" "${f%.png}png.png" 2>/dev/null || true; done
          cd ../../../../..

          # 6. Language Alias Fix: Copies Spanish HTML pages so they can be read outside of /html/ if linked that way
          cp PTBRepo/PTBWebsite/html/*.html staging/PTBRepo/PTBWebsite/ 2>/dev/null || true
          
          # 7. Add an automatic bounce rule at the root to drop visitors onto your primary index file
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./PTBRepo/PTBWebsite/html/index.html" /><script>window.location.href="./PTBRepo/PTBWebsite/html/index.html";</script></head></html>' > staging/index.html

      # Fix for Jekyll parser treating folder paths strictly
      - name: Add nojekyll rule
        run: touch staging/.nojekyll

      # Set up deployment configurations
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './staging'

      # Standard deployment step assigned to the correct "deployment" identifier
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
